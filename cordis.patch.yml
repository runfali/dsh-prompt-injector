# dsh-prompt-injector bundle patch
#
# Install (standard bundle plugin, no dsh source changes):
#   dsh plugin --profile web add /path/to/dsh-prompt-injector
# Uninstall:
#   dsh plugin --profile web remove dsh-prompt-injector
# Restart dsh after install/uninstall; settings-page edits apply immediately.
#
# Defaults (enabled on install): no built-in prompts — the mechanism ships
# empty (2026-08-29 open-source decision); users add their own prompts in
# Settings → Plugins → 上下文注入（通用提示词）. Example prompts live in the
# README "Prompt examples" section.

- insert:
    - id: prompt-injector
      name: dsh-prompt-injector
      config:
        # `enabled` / `skipTrivial` omitted: schema defaults true (enabled,
        # skip trivial rounds). `prompts` omitted: empty default = nothing
        # injected until the user adds prompts. All editable in the settings
        # page (user layer wins).
        enabled: true
        skipTrivial: true